name: iosApp
options:
  bundleIdPrefix: cz.mares
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_ENABLE_EXPLICIT_MODULES: "NO"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "101"
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    info:
      path: iosApp/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.mares.spacefury
        PRODUCT_NAME: SpaceFury
        INFOPLIST_FILE: iosApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_ENABLE_EXPLICIT_MODULES: "NO"
        ENABLE_BITCODE: "NO"
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../composeApp/build/bin/iosArm64/releaseFramework"
          - "$(SRCROOT)/../composeApp/build/bin/iosArm64/debugFramework"
          - "$(SRCROOT)/../composeApp/build/bin/iosSimulatorArm64/releaseFramework"
          - "$(SRCROOT)/../composeApp/build/bin/iosSimulatorArm64/debugFramework"
          - "$(SRCROOT)/../composeApp/build/bin/iosX64/releaseFramework"
          - "$(SRCROOT)/../composeApp/build/bin/iosX64/debugFramework"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "ComposeApp"
          - "-lsqlite3"
